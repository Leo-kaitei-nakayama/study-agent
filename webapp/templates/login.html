{% extends "base.html" %}
{% block title %}{{ t('login.title') }} — Study Agent{% endblock %}
{% block content %}
<div class="intro-hero">
  <h1>{{ t('login.title') }}</h1>
  <p>{{ t('login.subtitle') }}</p>
</div>
<div class="card">
  <form method="post">
    <label for="email">{{ t('signup.email') }}</label>
    <input type="email" id="email" name="email" placeholder="name@uci.edu" required>
    <button class="btn btn-primary btn-block" type="submit">{{ t('signup.send_code') }}</button>
  </form>
  <p class="form-footnote">
    {{ t('login.no_account') }} <a href="{{ url_for('signup') }}">{{ t('login.signup_link') }}</a>
  </p>
</div>
{% endblock %}
