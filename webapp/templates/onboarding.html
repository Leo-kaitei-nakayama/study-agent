{# 初回のプロフィール入力。ここで選ばれている言語がプロフィールに保存される。 #}
{% extends "base.html" %}
{% block title %}{{ t('onboarding.title') }} — Study Agent{% endblock %}
{% block content %}
<div class="intro-hero">
  <h1>{{ t('onboarding.title') }}</h1>
  <p>{{ t('onboarding.subtitle') }}</p>
</div>

<div class="card">
  <form method="post">
    <label for="preferred_name">{{ t('onboarding.name_q') }}</label>
    <input type="text" id="preferred_name" name="preferred_name" placeholder="Leo" required>

    <label for="school">{{ t('onboarding.school') }}</label>
    <input type="text" id="school" name="school" placeholder="UC Irvine">

    <label for="major">{{ t('onboarding.major') }}</label>
    <input type="text" id="major" name="major" placeholder="Business Information Management / CS">

    <label for="classes">{{ t('onboarding.classes') }}</label>
    <textarea id="classes" name="classes" rows="5"
      placeholder="MGMT 109&#10;CS 178&#10;STATS 7"></textarea>

    <button class="btn btn-primary btn-block" type="submit">{{ t('onboarding.start') }}</button>
  </form>
</div>
{% endblock %}
