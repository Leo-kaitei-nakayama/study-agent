{% extends "base.html" %}
{% block content %}
<div class="intro-hero">
  <div class="logo-row">
    <span class="logo-chip">Claude</span>
    <span class="logo-chip">ChatGPT</span>
    <span class="logo-chip">DeepSeek</span>
  </div>
  <h1>Study Agent</h1>
  <p>教科書からノート作成、練習課題のドラフト、Canvasのチェックまで。<br>
     タスクに合わせて最適なAIに自動で振り分けます。</p>
</div>

<div class="card">
  <form method="post">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" placeholder="name@uci.edu" required>
    <label for="username">ユーザー名</label>
    <input type="text" id="username" name="username" placeholder="leo_z" required>
    <button class="btn btn-primary btn-block" type="submit">確認コードを送信</button>
  </form>
  <p style="text-align:center; font-size:13px; color:var(--text-2); margin-top:14px;">
    すでにアカウントをお持ちですか? <a href="{{ url_for('login') }}">ログイン</a>
  </p>
</div>
{% endblock %}
