{# サインアップ画面。文字列は i18n.py の signup.* / common.* を参照。 #}
{% extends "base.html" %}
{% block content %}
<div class="intro-hero">
  <div class="logo-row">
    <span class="logo-chip">Claude</span>
    <span class="logo-chip">ChatGPT</span>
    <span class="logo-chip">DeepSeek</span>
  </div>
  <h1>Study Agent</h1>
  <p>{{ t('signup.tagline')|safe }}</p>
</div>

<div class="card">
  <form method="post">
    <label for="email">{{ t('signup.email') }}</label>
    <input type="email" id="email" name="email" placeholder="name@uci.edu" required>
    <label for="username">{{ t('signup.username') }}</label>
    <input type="text" id="username" name="username" placeholder="leo_z" required>
    <button class="btn btn-primary btn-block" type="submit">{{ t('signup.send_code') }}</button>
  </form>
  <p class="form-footnote">
    {{ t('signup.have_account') }} <a href="{{ url_for('login') }}">{{ t('signup.login_link') }}</a>
  </p>
</div>
{% endblock %}
